name: NEXORA kit

# 本ワークフローは nexora-kit/ の変更時のみ動作し、ライブラリ本体のビルドには関与しない。
on:
  push:
    paths: ['nexora-kit/**', '.github/workflows/nexora-kit.yml']
  pull_request:
    paths: ['nexora-kit/**', '.github/workflows/nexora-kit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexora-kit/payload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: kit self-check (T-000)
        run: python3 tools/kit_check.py

      - name: unit tests
        run: python3 -m unittest discover -s tests -t tests -v

      - name: source registry convergence
        run: python3 tools/source_registry_check.py

      - name: VEA compliance reconciliation
        run: python3 tools/vea_compliance_check.py

      - name: human gate registry
        run: python3 tools/human_gate_check.py --validate

      - name: Dream-Replay bootstrap
        run: python3 tools/dream_replay.py --bootstrap-check > /tmp/dream-replay.json

      - name: section disposition convergence
        run: python3 tools/disposition_check.py

      - name: requirement normalization
        run: python3 tools/requirements_check.py

      - name: conflict convergence
        run: python3 tools/conflict_check.py

      - name: traceability convergence
        run: python3 tools/traceability_check.py

      - name: converged state snapshot
        run: python3 tools/state_reduce.py --check

      - name: Section 70 structural audits
        run: |
          python3 tools/dependency_audit.py
          python3 tools/claim_audit.py
          python3 tools/failure_mode_audit.py
          python3 tools/critical_artifact_audit.py
          python3 tools/security_audit.py

      - name: TASK-007 Bitcoin reconnaissance
        run: python3 tools/bitcoin_header_recon.py

      - name: ORP Receipt checkpoint recovery
        run: python3 tools/orp_receipt_checkpoint.py

      - name: T-070 convergence gate (final host is the only allowed block)
        run: |
          set +e
          out="$(python3 tools/convergence_gate.py)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" != "1" ]; then
            echo "::error::T-070 must currently be blocked only by final_host (rc=$rc)"
            exit 1
          fi
          echo "$out" | grep -F "[BLOCK] final_host"
          if echo "$out" | grep -F "[BLOCK]" | grep -Fv "[BLOCK] final_host"; then
            echo "::error::T-070 has a blocker other than final_host"
            exit 1
          fi
          for label in source_registry disposition requirements conflicts traceability human_gate_registry state_projection; do
            echo "$out" | grep -F "[PASS] $label" >/dev/null || {
              echo "::error::T-070 missing PASS for $label"
              exit 1
            }
          done

      - name: install dry-run
        working-directory: nexora-kit
        run: python3 install.py --target "${RUNNER_TEMP}/nexora-target" --dry-run

      - name: implementation gate must stay BLOCKED (原文未投入のため)
        run: |
          set +e
          python3 tools/gate_check.py
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            echo "::error::原文未投入でゲートが解除された。判定条件が緩められている。"
            exit 1
          fi
